# SmartFlow AI + QHSE — full stack (demo / single-host deployment)
# Usage: cp .env.example .env && docker compose up -d --build   → http://localhost:${HTTP_PORT:-8088}/demo
name: smartflow

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smartflow
      POSTGRES_USER: ${DB_USERNAME:-smartflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-smartflow} -d smartflow"]
      interval: 10s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped

  ai-service:
    build: ./ai-service
    environment:
      ROUTING_TIME_LIMIT_S: ${ROUTING_TIME_LIMIT_S:-8}
    restart: unless-stopped

  backend:
    build: ./backend
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/smartflow
      DB_USERNAME: ${DB_USERNAME:-smartflow}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8088}
      CORS_ORIGINS: ${PUBLIC_URL:-http://localhost:8088}
      CACHE_TYPE: redis
      REDIS_HOST: redis
      AI_SERVICE_URL: http://ai-service:8000
      DEMO_ENABLED: ${DEMO_ENABLED:-true}
      DEMO_RESET_CRON: ${DEMO_RESET_CRON:-0 0 3 * * *}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    volumes: [files:/data/files]
    restart: unless-stopped

  web:
    build: ./frontend
    depends_on: [backend]
    ports: ["${HTTP_PORT:-8088}:80"]
    restart: unless-stopped

volumes:
  pgdata:
  files:
