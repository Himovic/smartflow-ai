name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_DB: smartflow_it, POSTGRES_USER: smartflow, POSTGRES_PASSWORD: smartflow }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U smartflow" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - name: Unit & integration tests
        working-directory: backend
        env:
          SMARTFLOW_IT: 'true'
          IT_DB_URL: jdbc:postgresql://localhost:5432/smartflow_it
        run: mvn -B verify

  ai-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - working-directory: ai-service
        run: |
          pip install -r requirements-dev.txt
          pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          python3 i18n-src/build.py
          npx ng build --configuration production

  docker:
    needs: [backend, ai-service, frontend]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build images
        run: |
          docker build -t smartflow-backend:ci backend
          docker build -t smartflow-ai-service:ci ai-service
          docker build -t smartflow-web:ci frontend
