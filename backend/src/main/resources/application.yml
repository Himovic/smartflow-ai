spring:
  application:
    name: smartflow-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/smartflow}
    username: ${DB_USERNAME:smartflow}
    password: ${DB_PASSWORD:smartflow}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:15}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 100
          time_zone: UTC
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: always
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 20MB
  cache:
    type: ${CACHE_TYPE:simple}
    cache-names: tenantModules
    redis:
      time-to-live: 300s
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:25}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  compression:
    enabled: true
    mime-types: application/json,application/pdf,text/plain

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    redis:
      enabled: ${REDIS_HEALTH:false}
    mail:
      enabled: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

smartflow:
  public-url: ${PUBLIC_URL:http://localhost:4200}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200,http://localhost}
  security:
    jwt:
      secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789-abcdefghijklmnopqrstuvwxyz}
      access-token-ttl: ${JWT_ACCESS_TTL:15m}
      refresh-token-ttl: ${JWT_REFRESH_TTL:7d}
      issuer: smartflow-ai
    encryption-key: ${ENCRYPTION_KEY:dev-only-encryption-key-change-me}
  storage:
    path: ${STORAGE_PATH:./data/files}
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:no-reply@smartflow.local}
  ai:
    enabled: ${AI_ENABLED:true}
    base-url: ${AI_SERVICE_URL:http://localhost:8000}
    timeout: ${AI_TIMEOUT:20s}
  integrations:
    scheduler-enabled: ${INTEGRATIONS_SCHEDULER:true}
    poll-interval: 60000
  demo:
    enabled: ${DEMO_ENABLED:true}
    reset-cron: ${DEMO_RESET_CRON:-}

logging:
  level:
    com.dnd.smartflow: INFO
    org.hibernate.SQL: WARN
